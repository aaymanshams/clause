spring:
  application:
    name: clauseiq
  # Lets a local .env file (KEY=value) supply OPENAI_API_KEY etc. without exporting it.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clauseiq}
    username: ${DB_USERNAME:clauseiq}
    password: ${DB_PASSWORD:clauseiq}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health

clauseiq:
  jwt:
    # No default on purpose. Unset = random per-process key (local dev). Set JWT_SECRET (32+ bytes) when shared.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
    max-file-size-bytes: 10485760
  processing:
    async: true
  ai:
    # auto = use OpenAI when OPENAI_API_KEY is set, otherwise the offline fallback.
    provider: ${AI_PROVIDER:auto}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      timeout-seconds: 60
  rag:
    top-k: 5
    # OpenAI embeddings: chunks below this cosine similarity are treated as irrelevant.
    min-similarity: 0.2
  risk:
    max-termination-notice-days: 60
    high-termination-notice-days: 120
    max-auto-renewal-months: 12
    preferred-governing-laws:
      - India
      - Delaware
      - New York
      - England and Wales
      - California
