services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clauseiq
      POSTGRES_USER: clauseiq
      POSTGRES_PASSWORD: clauseiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseiq -d clauseiq"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://db:5432/clauseiq
      DB_USERNAME: clauseiq
      DB_PASSWORD: clauseiq
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/data

volumes:
  pgdata:
  uploads:
